method: "common_trace_constrained_ppo"

runtime:
  device: "cpu"
  deterministic_algorithms: true
  torch_num_threads: 1

training:
  seed: 0
  physical_slots: 1000000
  arrival_regimes: ["independent", "clustered"]
  rollout_target_physical_slots: 5000
  learning_rate_schedule: "linear"
  learning_rate_schedule_horizon_physical_slots: 1000000

validation:
  enabled: true
  run_before_training: true
  interval_physical_slots: 10000
  trace_seeds: [51001, 51002, 51003, 51004, 51005, 51006, 51007, 51008, 51009, 51010, 51011, 51012, 51013, 51014, 51015, 51016, 51017, 51018, 51019, 51020]
  arrival_regimes: ["independent", "clustered"]
  random_valid_root_seed: 53001
  random_valid_replicates_per_trace: 4

checkpoint:
  interval_physical_slots: 10000
  best_metric: "paired_return_difference"
  keep_top_k: 1
  save_latest_every_rollout: true

logging:
  progress: true
  progress_every_rollouts: 1
  jsonl: true
  csv: true
  flush_every_records: 10
